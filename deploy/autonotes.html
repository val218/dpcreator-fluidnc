<style>
.dpc-auto{margin:22px 0 34px}
.dpc-auto[hidden]{display:none}
.dpc-auto .an-builds{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:0 0 20px}
.dpc-auto .an-build{border:1px solid rgba(127,127,127,.3);border-radius:4px;padding:12px 14px}
.dpc-auto .an-build b{display:block;font-size:14px}
.dpc-auto .an-build span{font:12.5px ui-monospace,Menlo,Consolas,monospace;opacity:.75}
.dpc-auto .an-tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.dpc-auto .an-tabs button{border:1px solid rgba(127,127,127,.35);background:transparent;border-radius:3px;padding:6px 12px;font-size:13px;cursor:pointer;color:inherit}
.dpc-auto .an-tabs button[aria-selected="true"]{background:#2b8fe0;border-color:#2b8fe0;color:#fff}
.dpc-auto .an-day{margin:14px 0 4px;font-weight:700;font-size:14px}
.dpc-auto ul{margin:0 0 6px;padding-left:0;list-style:none}
.dpc-auto li{padding:4px 0 4px 64px;position:relative;line-height:1.45;font-size:14px}
.dpc-auto li i{position:absolute;left:0;top:6px;font-style:normal;font-size:11px;font-weight:700;padding:1px 6px;border-radius:3px;background:rgba(43,143,224,.15);color:#1b6fb5}
.dpc-auto li i.fx{background:rgba(46,155,74,.15);color:#237a3a}
.dpc-auto .an-more{margin-top:8px;border:0;background:none;color:#2b8fe0;cursor:pointer;padding:0;font-size:14px}
.dpc-auto .an-foot{font-size:12.5px;opacity:.7;margin-top:12px}
</style>
<section class="dpc-auto" id="dpc-auto" hidden>
<h2>Current builds</h2>
<div class="an-builds" id="an-builds"></div>
<h2>Latest changes</h2>
<p>Updated automatically from each published build, newest first.</p>
<div class="an-tabs" role="tablist" id="an-tabs"></div>
<div id="an-list"></div>
<p class="an-foot" id="an-foot"></p>
</section>
<script>
(function(){
  var box=document.getElementById("dpc-auto"); if(!box) return;
  var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});};
  var fmt=function(d){var p=d.split("-");var m=["January","February","March","April","May","June","July","August","September","October","November","December"];return p.length===3?(+p[2])+" "+m[+p[1]-1]+" "+p[0]:d;};
  fetch("/notes.php",{cache:"no-cache"}).then(function(r){if(!r.ok)throw 0;return r.json();}).then(function(d){
    var P=(d.products||[]).filter(function(p){return p.entries&&p.entries.length;}); if(!P.length) return;
    document.getElementById("an-builds").innerHTML=d.products.map(function(p){return '<div class="an-build"><b>'+esc(p.name)+'</b><span>build '+esc(p.build||"-")+(p.date?" · "+esc(fmt(p.date)):"")+'</span></div>';}).join("");
    var tabs=document.getElementById("an-tabs"), list=document.getElementById("an-list"), cur=0, all=false;
    function show(i){cur=i;
      [].forEach.call(tabs.children,function(b,k){b.setAttribute("aria-selected",k===i?"true":"false");});
      var e=P[i].entries, n=all?e.length:Math.min(15,e.length), h="", day="";
      for(var k=0;k<n;k++){var x=e[k]; if(x.date!==day){if(day)h+="</ul>"; day=x.date; h+='<div class="an-day">'+esc(fmt(day))+'</div><ul>';}
        h+='<li><i class="'+(x.type==="fixed"?"fx":"nw")+'">'+(x.type==="fixed"?"Fixed":"New")+'</i>'+esc(x.text)+'</li>';}
      if(day)h+="</ul>";
      if(e.length>15) h+='<button type="button" class="an-more">'+(all?"Show fewer":"Show all "+e.length+" changes")+'</button>';
      list.innerHTML=h; var m=list.querySelector(".an-more"); if(m)m.onclick=function(){all=!all;show(cur);};
    }
    tabs.innerHTML=P.map(function(p,i){return '<button type="button" role="tab">'+esc(p.name.replace(/ firmware$/,""))+'</button>';}).join("");
    [].forEach.call(tabs.children,function(b,i){b.onclick=function(){all=false;show(i);};});
    document.getElementById("an-foot").textContent="Last checked "+new Date(d.updated).toLocaleString()+".";
    box.hidden=false; show(0);
  }).catch(function(){});
})();
</script>
