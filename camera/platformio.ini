; dpCREATOR head camera: an ESP32 camera module as the WebUI's camera crosshair.
;   cd camera && pio run -e s3_eye -t upload
; Envs (choose the one with your module's camera pins):
;   s3_eye    ESP32-S3-EYE and Freenove ESP32-S3-WROOM CAM (N8R8 / N16R8)
;   xiao_s3   Seeed XIAO ESP32S3 Sense
;   esp32cam  AI-Thinker ESP32-CAM (classic ESP32, flash LED on GPIO 4)
[platformio]
default_envs = s3_eye

[common]
framework = arduino
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=1

[common_s3]
extends = common
platform = https://github.com/pioarduino/platform-espressif32.git#55.03.39
board_build.arduino.memory_type = qio_opi
board_build.partitions = huge_app.csv
build_flags =
    ${common.build_flags}
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

[env:s3_eye]
extends = common_s3
board = esp32-s3-devkitc-1
board_upload.flash_size = 8MB
build_flags =
    ${common_s3.build_flags}
    -DCAM_S3_EYE

[env:xiao_s3]
extends = common_s3
board = seeed_xiao_esp32s3
build_flags =
    ${common_s3.build_flags}
    -DCAM_XIAO_S3

[env:esp32cam]
extends = common
platform = https://github.com/platformio/platform-espressif32.git#v6.9.0
platform_packages = platformio/framework-arduinoespressif32@^3.20017.241212
board = esp32cam
board_build.partitions = huge_app.csv
build_flags =
    ${common.build_flags}
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCAM_AI_THINKER
