board: dpCREATOR R3.1
name: dpCREATOR CNC, dual Y, RS485 VFD (W5500)
meta: ESP32-S3-WROOM-1-N16R8, FluidNC 4.1.1 + W5500

# ------------------------------------------------------------------
# UART0 = FluidNC console: TXD0 = GPIO43, RXD0 = GPIO44, 115200 8N1
#   (UART_0 connector J7). A uart0: section gives it to an I/O expander
#   (uart_channel2 with uart_num: 0); the console then stays on USB only.
#   See W5500_ETHERNET.md section 18.
# USB CDC console on native USB (GPIO19/20) is also available.
# ------------------------------------------------------------------

stepping:
  engine: RMT
  idle_ms: 255
  pulse_us: 4
  dir_delay_us: 1
  disable_delay_us: 0
  segments: 12

# ---------------- SPI bus: SD card + W5500 ----------------
spi:
  miso_pin: gpio.13
  mosi_pin: gpio.11
  sck_pin: gpio.12

sdcard:
  cs_pin: gpio.10
  card_detect_pin: NO_PIN
  frequency_hz: 8000000

ethernet:
  cs_pin: gpio.14
  int_pin: gpio.9
  rst_pin: NO_PIN
  phy_type: w5500
  phy_addr: 1
  frequency_hz: 8000000

# ---------------- UART1: TabUI pendant ----------------
uart1:
  txd_pin: gpio.1
  rxd_pin: gpio.2
  rts_pin: NO_PIN
  cts_pin: NO_PIN
  baud: 1000000        # TabUI / Fluid Dial pendant firmware is built with FNC_BAUD=1000000
  mode: 8N1

uart_channel1:
  uart_num: 1
  report_interval_ms: 75
  message_level: Info

# ---------------- UART2: RS485 (DE on GPIO40) ----------------
uart2:
  txd_pin: gpio.42
  rxd_pin: gpio.41
  rts_pin: gpio.40
  cts_pin: NO_PIN
  baud: 9600
  mode: 8N1

# ---------------- Axes ----------------
kinematics:
  Cartesian:

axes:
  shared_stepper_disable_pin: gpio.8:low # STEP_EN: GPIO8 HIGH enables the step/dir outputs (U7)
  shared_stepper_reset_pin: NO_PIN
  homing_runs: 2

  x:
    steps_per_mm: 400.000                # <-- SET for your mechanics
    max_rate_mm_per_min: 3000.000
    acceleration_mm_per_sec2: 200.000
    max_travel_mm: 600.000
    soft_limits: false
    homing:
      cycle: 2
      positive_direction: false
      mpos_mm: 0.000
      feed_mm_per_min: 200.000
      seek_mm_per_min: 1500.000
      settle_ms: 250
    motor0:
      limit_all_pin: gpio.47:low         # LIM_X (optocoupler)
      hard_limits: false
      pulloff_mm: 2.000
      standard_stepper:
        step_pin: gpio.4
        direction_pin: gpio.5
        disable_pin: NO_PIN

  y:
    steps_per_mm: 400.000                # <-- SET
    max_rate_mm_per_min: 3000.000
    acceleration_mm_per_sec2: 200.000
    max_travel_mm: 400.000
    soft_limits: false
    homing:
      cycle: 2
      positive_direction: false
      mpos_mm: 0.000
      feed_mm_per_min: 200.000
      seek_mm_per_min: 1500.000
      settle_ms: 250
    # Two Y motors (gantry): Y1 on the Y driver, Y2 on the 4th (A) driver,
    # each with its own limit switch, so homing squares the gantry.
    motor0:
      limit_all_pin: gpio.48:low         # LIM_Y  (Y1)
      hard_limits: false
      pulloff_mm: 2.000
      standard_stepper:
        step_pin: gpio.6
        direction_pin: gpio.7
        disable_pin: NO_PIN
    motor1:
      limit_all_pin: gpio.38:low         # LIM_A  (Y2)
      hard_limits: false
      pulloff_mm: 2.000
      standard_stepper:
        step_pin: gpio.17                # A driver
        direction_pin: gpio.18           # add :low here if Y2 must turn the other way
        disable_pin: NO_PIN

  z:
    steps_per_mm: 400.000                # <-- SET
    max_rate_mm_per_min: 1500.000
    acceleration_mm_per_sec2: 100.000
    max_travel_mm: 100.000
    soft_limits: false
    homing:
      cycle: 1
      positive_direction: true
      mpos_mm: 0.000
      feed_mm_per_min: 100.000
      seek_mm_per_min: 800.000
      settle_ms: 250
    motor0:
      # LIM_Z and the PROBE terminal are one line (OK3 -> GPIO3): the Z limit
      # here, and the probe too (probe: use_z_limit_pin)
      limit_all_pin: gpio.3:low
      hard_limits: false
      pulloff_mm: 2.000
      standard_stepper:
        step_pin: gpio.15
        direction_pin: gpio.16
        disable_pin: NO_PIN

  # A rotary axis instead of Y2: remove motor1 from y: above and uncomment.
  # a:
  #   steps_per_mm: 400.000               # <-- SET (rotary: steps per degree)
  #   max_rate_mm_per_min: 3000.000
  #   acceleration_mm_per_sec2: 200.000
  #   max_travel_mm: 360.000
  #   soft_limits: false
  #   motor0:
  #     limit_all_pin: gpio.38:low       # LIM_A
  #     hard_limits: false
  #     pulloff_mm: 2.000
  #     standard_stepper:
  #       step_pin: gpio.17
  #       direction_pin: gpio.18
  #       disable_pin: NO_PIN

# ---------------- Probe ----------------
probe:
  pin: NO_PIN
  use_z_limit_pin: true                  # PROBE terminal = Z limit input (GPIO3): G38 probes on it,
                                         # homing and hard limits use it as the Z limit otherwise
  toolsetter_pin: NO_PIN
  check_mode_start: true

# ---------------- Spindle ----------------
# Tool 0 = RS485 VFD on UART2 (main spindle). Select with M6 T0 (default).
# R3 RS485 terminal J8: A -> VFD RS+ (A), B -> VFD RS- (B), GND -> VFD COM.
# Huanyang settings: PD001=2, PD002=2, PD163=1 (= modbus_id), PD164=1 (9600), PD165=3 (8N1 RTU).
# Other VFDs: replace "Huanyang:" with H100, H2A, YL620, NowForever, SiemensV20,
#   DeltaMS300, FolinnBD600 or MollomG70 (same keys). Add "debug: 1" to log Modbus traffic.
Huanyang:
  uart_num: 2
  modbus_id: 1
  tool_num: 0
  spinup_ms: 5000
  spindown_ms: 5000
  speed_map: 0=0% 24000=100%
  off_on_alarm: true

# Tool 1 = PWM on GPIO21 (5 V PWM terminal + 0-10 V output), relay K1 (GPIO39) as on/off.
# Select with M6 T1. For a laser on this output, change "PWM:" to "Laser:" and remove
# enable_pin/spinup_ms/spindown_ms.
PWM:
  pwm_hz: 5000
  output_pin: gpio.21
  enable_pin: gpio.39
  direction_pin: NO_PIN
  disable_with_s0: false
  s0_with_disable: true
  spinup_ms: 2000
  spindown_ms: 2000
  tool_num: 1
  speed_map: 0=0.000% 24000=100.000%

coolant:
  flood_pin: NO_PIN
  mist_pin: NO_PIN

control:
  # E-stop sense on GPIO46, HIGH = E-stop active (the hardware also cuts
  # the step/dir outputs). A press stops at once with ALARM:13 (Hard Stop).
  # GPIO46 is a strapping pin: no :pu / :pd here, and never an output.
  estop_pin: gpio.46
  safety_door_pin: NO_PIN
  reset_pin: NO_PIN
  feed_hold_pin: NO_PIN
  cycle_start_pin: NO_PIN

start:
  must_home: false