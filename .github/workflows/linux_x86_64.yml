name: Build linux_x86_64

on:
  workflow_dispatch:
  push:
    branches: [fluidnc-4.1.1-w5500]
  pull_request:
    branches: [fluidnc-4.1.1-w5500]

jobs:
  build:
    # Pinned: ubuntu-latest moved to 26.04, whose system headers break the
    # Arduino-Emulator's Binary.h (and which has no Python 3.9 for the tests)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio-linux_x86_64-${{ hashFiles('**/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-linux_x86_64-

      - name: Build linux_x86_64
        run: pio run -e linux_x86_64

      - name: Smoke test (boots, answers $I, runs a file from the host "SD card")
        run: |
          mkdir -p smoke/native_localfs smoke/native_sd && cd smoke
          printf 'G21 G90\nG1 X1 F600\n(PRINT,smoke ok)\nM2\n' > native_sd/smoke.nc
          (printf '$I\n$SD/Run=/smoke.nc\n'; sleep 4) | timeout 10 ../.pio/build/linux_x86_64/program - | tee out.txt || true
          grep -q "VER:" out.txt

      - name: IO16 expander test (simulated dpCREATOR IO16 on a pty)
        run: |
          mkdir -p io16/native_localfs io16/native_sd && cd io16
          cat > native_localfs/config.yaml <<'YAML'
          name: io16 test
          board: host
          uart1:
            txd_pin: gpio.1
            rxd_pin: gpio.2
            baud: 1000000
            mode: 8N1
          uart_channel1:
            uart_num: 1
            report_interval_ms: -100
            message_level: Info
          control:
            safety_door_pin: uart_channel1.0
          coolant:
            flood_pin: uart_channel1.16
          user_outputs:
            digital0_pin: uart_channel1.17
            digital15_pin: uart_channel1.31
            analog0_pin: uart_channel1.22
            analog0_hz: 1000
          user_inputs:
            digital0_pin: uart_channel1.5
            digital1_pin: uart_channel1.6:low
            digital15_pin: uart_channel1.15
          YAML
          python3 ../tools/io16_sim.py --dir . --uart 1 --inputs 00A0 > sim.log 2>&1 &
          SIM=$!
          sleep 1
          (sleep 2; printf '$Report/Expander=On\n'; sleep 0.5; printf '?'; sleep 0.3
           printf '$EXPP\nM62 P0\nM67 E0 Q50\nM8\n'; sleep 0.6; printf '?'; sleep 0.3
           echo 80 > io16_inputs; sleep 0.5
           printf '?$EXP\nM66 P0 L0\n(PRINT,in0=#5399)\nM66 P1 L0\n(PRINT,in1=#5399)\n'; sleep 2
           kill $SIM; sleep 3.5; printf '?'; sleep 0.3
           printf '$Report/Expander=Off\n?'; sleep 0.5) | timeout 20 ../.pio/build/linux_x86_64/program - > out.txt 2>&1 || true
          cat out.txt sim.log
          set -x
          grep -q "IO Expander dpCREATOR IO16 v1.0.0" out.txt
          grep -q "|EXP:1,00A0,0000,07" out.txt          # heartbeat OK although report_interval_ms is negative
          grep -q "|EXP:1,00A0,0043,07" out.txt          # OUT1 (flood), OUT2 (M62), OUT7 (PWM) on
          grep -q "|EXP:1,0080,0043,07" out.txt          # input change
          grep -q "\[EXP:1,ID=dpCREATOR IO16 v1.0.0,IN=0080,OUT=0043,FLAGS=07\]" out.txt
          grep -q "\[EXP:PIN=1.0,control/safety_door_pin,in\]" out.txt
          grep -q "\[EXP:PIN=1.6,user_inputs/digital1_pin,in,low\]" out.txt
          grep -q "\[EXP:PIN=1.22,user_outputs/analog0_pin,pwm\]" out.txt
          grep -q "PRINT,in0=0.000000" out.txt
          grep -q "PRINT,in1=1.000000" out.txt
          grep -q "|EXP:1,-" out.txt                     # expander gone: offline after 3 s
          if grep -q "no heartbeat" sim.log; then exit 1; fi
          tail -n 5 out.txt | grep "<Idle" | tail -1 | grep -vq "EXP:"  # setting off: no field

      - name: IO16 M66 waits on an expander input
        run: |
          cd io16 && rm -f native_uart1 io16_inputs out.txt sim.log
          python3 ../tools/io16_sim.py --dir . --uart 1 --inputs 0000 --quiet > sim.log 2>&1 &
          SIM=$!
          sleep 1
          (sleep 2; printf '$EXP\nM66 P0 L3 Q3\n(PRINT,a=#5399)\n'; sleep 0.7; echo 20 > io16_inputs; sleep 0.5
           printf 'M66 P0 L2 Q2\n(PRINT,b=#5399)\n'; sleep 0.5; echo 00 > io16_inputs; sleep 0.5
           printf 'M66 P0 L3 Q0.5\n(PRINT,d=#5399)\nG1 X5 F300\nM66 P0 L0\n(PRINT,e=#5399)\n'; sleep 0.4
           echo 8020 > io16_inputs; sleep 2.5
           printf 'M62 P15\nM66 P15 L0\n(PRINT,f=#5399)\n'; sleep 0.5; printf '$EXP\n'; sleep 0.5) | timeout 20 ../.pio/build/linux_x86_64/program - > out.txt 2>&1 || true
          kill $SIM || true
          cat out.txt
          set -x
          grep -q "\[EXP:CAPS=M66WAIT,UIO=" out.txt
          grep -q "PRINT,a=1.000000" out.txt   # L3: input went high during the wait
          grep -q "PRINT,b=0.000000" out.txt   # L2: falling edge
          grep -q "PRINT,d=-1.000000" out.txt  # timeout
          grep -q "PRINT,e=1.000000" out.txt   # L0 reads after the move (input changed during it)
          grep -q "\[EXP:CAPS=M66WAIT,UIO=16\]" out.txt
          grep -q "PRINT,f=1.000000" out.txt   # user input 15 = IN16
          grep -q "IN=8020,OUT=8000" out.txt   # user output 15 = OUT16

      - name: IO16 bootloader command
        run: |
          cd io16 && rm -f native_uart1 io16_inputs io16_boot_rx out.txt sim.log
          python3 ../tools/io16_sim.py --dir . --uart 1 --inputs 0000 > sim.log 2>&1 &
          SIM=$!
          sleep 1
          (sleep 2; printf 'M62 P0\n$EXPB=3\n$EXPB\n'; sleep 3; printf '?'; sleep 0.3) | timeout 20 ../.pio/build/linux_x86_64/program - > out.txt 2>&1 || true
          kill $SIM || true
          sleep 0.5
          cat out.txt sim.log
          set -x
          grep -q "No IO expander on uart_channel3" out.txt
          grep -q "uart_channel1: expander is in its bootloader" out.txt
          grep -q "BOOT: now in the ROM bootloader" sim.log
          test "$(cat io16_boot_rx)" = 0                # nothing sent to the bootloader afterwards

      - name: Automations (follow, M-code, timer, input, hold) on the simulated IO16
        run: |
          mkdir -p auto/native_localfs auto/native_sd && cd auto
          cat > native_localfs/config.yaml <<'YAML'
          name: automation test
          board: host
          uart1:
            txd_pin: gpio.1
            rxd_pin: gpio.2
            baud: 1000000
            mode: 8N1
          uart_channel1:
            uart_num: 1
            report_interval_ms: 100
            message_level: Info
          user_outputs:
            digital0_pin: uart_channel1.16
            digital1_pin: uart_channel1.17
            digital2_pin: uart_channel1.18
            digital3_pin: uart_channel1.19
          user_inputs:
            digital0_pin: uart_channel1.0
          YAML
          cat > native_localfs/automation.json <<'JSON'
          {"version": 1, "rules": [
           {"name": "Dust extraction", "type": "follow", "when": "spindle", "out": 0, "off_delay": 1},
           {"name": "Vacuum on", "type": "mcode", "code": 110, "actions": [{"do": "out", "n": 1, "value": 1}]},
           {"name": "Vacuum off", "type": "mcode", "code": 111, "actions": [{"do": "out", "n": 1, "value": 0}]},
           {"name": "Lube", "type": "timer", "every": 2, "actions": [{"do": "pulse", "n": 2, "time": 0.5}]},
           {"name": "Pedal", "type": "input", "input": {"user": 0}, "edge": "rise", "actions": [{"do": "out", "n": 3, "value": "toggle"}, {"do": "msg", "text": "pedal"}]},
           {"name": "Vacuum lost", "type": "input", "input": {"exp": 1, "in": 2}, "edge": "fall", "only": "job", "actions": [{"do": "hold", "text": "Vacuum lost"}]}
          ]}
          JSON
          python3 ../tools/io16_sim.py --dir . --uart 1 --inputs 0002 > sim.log 2>&1 &
          SIM=$!
          sleep 1
          (sleep 2; printf '$AUL\nM3 S1000\nG4 P0.3\n'; sleep 0.3; printf 'M5\nG4 P0.1\n'; sleep 1.5
           printf 'M110\n(PRINT,after110)\nM111\nM150\n'; sleep 1; echo 0003 > io16_inputs; sleep 0.5; echo 0002 > io16_inputs; sleep 0.3
           printf 'G1 X20 F600\n'; sleep 0.5; echo 0000 > io16_inputs; sleep 0.5; printf '?'; sleep 0.5) \
            | timeout 25 ../.pio/build/linux_x86_64/program - > out.txt 2>&1 || true
          kill $SIM || true
          cat out.txt sim.log
          set -x
          grep -q "Automation: 6 rule(s) from automation.json" out.txt
          grep -q "\[AUTO:1,mcode,ready,M110,Vacuum on\]" out.txt
          grep -q "OUT1 on" sim.log && grep -q "OUT1 off" sim.log    # dust extraction followed the spindle
          grep -q "OUT2 on" sim.log && grep -q "OUT2 off" sim.log    # M110 / M111
          grep -q "PRINT,after110" out.txt
          grep -q "Unsupported GCode command" out.txt               # M150 has no rule
          [ "$(grep -c 'OUT3 on' sim.log)" -ge 2 ]                    # lube pulses
          grep -q "OUT4 on" sim.log && grep -q "Automation: pedal" out.txt
          grep -q "Automation: Vacuum lost" out.txt && grep -q "<Hold" out.txt

      - name: Probe on the Z limit input (probe use_z_limit_pin)
        run: |
          mkdir -p pz/native_localfs pz/native_gpio && cd pz
          cat > native_localfs/config.yaml <<'YAML'
          name: probe on z limit
          board: host
          axes:
            z:
              steps_per_mm: 400
              max_rate_mm_per_min: 1000
              acceleration_mm_per_sec2: 50
              max_travel_mm: 100
              motor0:
                limit_all_pin: gpio.3:low
                hard_limits: true
                null_motor:
          probe:
            use_z_limit_pin: true
          YAML
          touch native_gpio/3   # HIGH: open (active low)
          (sleep 2.5; printf 'G21 G91 G38.2 Z-20 F300\n'; sleep 0.8; rm native_gpio/3; sleep 0.6
           printf 'G38.4 Z5 F300\n'; sleep 0.6; touch native_gpio/3; sleep 0.6
           printf 'G1 Z-10 F300\n'; sleep 0.6; rm native_gpio/3; sleep 0.5; printf '?'; sleep 0.3) \
            | timeout 15 ../.pio/build/linux_x86_64/program - > out.txt 2>&1 || true
          cat out.txt
          set -x
          grep -q "Probe: on the Z limit input gpio.3:low" out.txt
          [ "$(grep -c ':1\]$' out.txt)" -ge 2 ]                   # G38.2 and G38.4 both hit ([PRB:...:1])
          [ "$(grep -c 'ALARM:1$' out.txt)" -eq 1 ]                 # only the plain G1 trips the hard limit
          grep -q "Pn:PZ" out.txt

      - name: Panels and outputs ($Panel/List, $Output/Toggle during a job)
        run: |
          mkdir -p pn/native_localfs pn/native_sd/.dpc/panels && cd pn
          cat > native_localfs/config.yaml <<'YAML'
          name: panels
          board: host
          axes:
            x:
              steps_per_mm: 80
              max_rate_mm_per_min: 6000
              acceleration_mm_per_sec2: 500
              max_travel_mm: 300
              motor0:
                null_motor:
          user_outputs:
            digital1_pin: gpio.13
            digital2_pin: gpio.12
          YAML
          cat > native_sd/.dpc/panels/shop.json <<'JSON'
          {"format":"dpcreator-panel/1","id":"shop","title":"Shop",
           "fields":[{"id":"d","label":"D","type":"number","default":2.5}],
           "buttons":[{"label":"Light","output":2},{"label":"Go","macro":"go"},{"label":"Park","gcode":["G53 G0 X0"]}],
           "macros":{"go":["G91 G1 X[#<_panel_d>] F600","G90"]}}
          JSON
          python3 -c "open('native_sd/long.nc','w').write('G91\n' + 'G1 X1 F300\n'*40 + 'G90\n')"
          (sleep 2.5; printf '$Panel/List\n'; sleep 0.4; printf '$SD/Run=/long.nc\n'; sleep 1
           printf '$Output/Toggle=2\n$Output/Set=1,1\n'; sleep 0.4; printf '?'; sleep 0.3) \
            | timeout 10 ../.pio/build/linux_x86_64/program - > out.txt 2>&1 || true
          cat out.txt
          set -x
          grep -q "\[PANELBTN:shop|0|#94a3b8|Light|any|\]" out.txt
          grep -q "\[PANELCMD:shop|1|#<_panel_d>=2.5\]" out.txt
          grep -q "\[PANELCMD:shop|1|\$SD/Run=/.dpc/panels/shop/go.nc\]" out.txt
          grep -q "\[PANEL:end|3\]" out.txt
          grep -q "\[OUT:2,1\]" out.txt && grep -q "\[OUT:1,1\]" out.txt   # switched while the job runs
          ! grep -q "error:120" out.txt

      - name: Motion check (S-curve vs straight ramps, from the segment trace)
        run: python3 tools/motion_check.py .pio/build/linux_x86_64/program

      - name: RS485 check ($VFD/State, $Modbus/Read, Write, Raw, Scan against a simulated YL620)
        run: python3 tools/vfd_check.py .pio/build/linux_x86_64/program

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fluidnc-linux_x86_64
          path: .pio/build/linux_x86_64/program
          if-no-files-found: error
