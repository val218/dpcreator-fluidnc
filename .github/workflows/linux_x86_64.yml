name: Build linux_x86_64

on:
  workflow_dispatch:
  push:
    branches: [fluidnc-4.1.1-w5500]
  pull_request:
    branches: [fluidnc-4.1.1-w5500]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio-linux_x86_64-${{ hashFiles('**/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-linux_x86_64-

      - name: Build linux_x86_64
        run: pio run -e linux_x86_64

      - name: Smoke test (boots, answers $I, runs a file from the host "SD card")
        run: |
          mkdir -p smoke/native_localfs smoke/native_sd && cd smoke
          printf 'G21 G90\nG1 X1 F600\n(PRINT,smoke ok)\nM2\n' > native_sd/smoke.nc
          (printf '$I\n$SD/Run=/smoke.nc\n'; sleep 4) | timeout 10 ../.pio/build/linux_x86_64/program - | tee out.txt || true
          grep -q "VER:" out.txt

      - name: IO16 expander test (simulated dpCREATOR IO16 on a pty)
        run: |
          mkdir -p io16/native_localfs io16/native_sd && cd io16
          cat > native_localfs/config.yaml <<'YAML'
          name: io16 test
          board: host
          uart1:
            txd_pin: gpio.1
            rxd_pin: gpio.2
            baud: 1000000
            mode: 8N1
          uart_channel1:
            uart_num: 1
            report_interval_ms: -100
            message_level: Info
          control:
            safety_door_pin: uart_channel1.0
          coolant:
            flood_pin: uart_channel1.16
          user_outputs:
            digital0_pin: uart_channel1.17
            digital15_pin: uart_channel1.31
            analog0_pin: uart_channel1.22
            analog0_hz: 1000
          user_inputs:
            digital0_pin: uart_channel1.5
            digital1_pin: uart_channel1.6:low
            digital15_pin: uart_channel1.15
          YAML
          python3 ../tools/io16_sim.py --dir . --uart 1 --inputs 00A0 > sim.log 2>&1 &
          SIM=$!
          sleep 1
          (sleep 2; printf '$Report/Expander=On\n'; sleep 0.5; printf '?'; sleep 0.3
           printf '$EXPP\nM62 P0\nM67 E0 Q50\nM8\n'; sleep 0.6; printf '?'; sleep 0.3
           echo 80 > io16_inputs; sleep 0.5
           printf '?$EXP\nM66 P0 L0\n(PRINT,in0=#5399)\nM66 P1 L0\n(PRINT,in1=#5399)\n'; sleep 2
           kill $SIM; sleep 3.5; printf '?'; sleep 0.3
           printf '$Report/Expander=Off\n?'; sleep 0.5) | timeout 20 ../.pio/build/linux_x86_64/program - > out.txt 2>&1 || true
          cat out.txt sim.log
          set -x
          grep -q "IO Expander dpCREATOR IO16 v1.0.0" out.txt
          grep -q "|EXP:1,00A0,0000,07" out.txt          # heartbeat OK although report_interval_ms is negative
          grep -q "|EXP:1,00A0,0043,07" out.txt          # OUT1 (flood), OUT2 (M62), OUT7 (PWM) on
          grep -q "|EXP:1,0080,0043,07" out.txt          # input change
          grep -q "\[EXP:1,ID=dpCREATOR IO16 v1.0.0,IN=0080,OUT=0043,FLAGS=07\]" out.txt
          grep -q "\[EXP:PIN=1.0,control/safety_door_pin,in\]" out.txt
          grep -q "\[EXP:PIN=1.6,user_inputs/digital1_pin,in,low\]" out.txt
          grep -q "\[EXP:PIN=1.22,user_outputs/analog0_pin,pwm\]" out.txt
          grep -q "PRINT,in0=0.000000" out.txt
          grep -q "PRINT,in1=1.000000" out.txt
          grep -q "|EXP:1,-" out.txt                     # expander gone: offline after 3 s
          if grep -q "no heartbeat" sim.log; then exit 1; fi
          tail -n 5 out.txt | grep "<Idle" | tail -1 | grep -vq "EXP:"  # setting off: no field

      - name: IO16 M66 waits on an expander input
        run: |
          cd io16 && rm -f native_uart1 io16_inputs out.txt sim.log
          python3 ../tools/io16_sim.py --dir . --uart 1 --inputs 0000 --quiet > sim.log 2>&1 &
          SIM=$!
          sleep 1
          (sleep 2; printf '$EXP\nM66 P0 L3 Q3\n(PRINT,a=#5399)\n'; sleep 0.7; echo 20 > io16_inputs; sleep 0.5
           printf 'M66 P0 L2 Q2\n(PRINT,b=#5399)\n'; sleep 0.5; echo 00 > io16_inputs; sleep 0.5
           printf 'M66 P0 L3 Q0.5\n(PRINT,d=#5399)\nG1 X5 F300\nM66 P0 L0\n(PRINT,e=#5399)\n'; sleep 0.4
           echo 8020 > io16_inputs; sleep 2.5
           printf 'M62 P15\nM66 P15 L0\n(PRINT,f=#5399)\n'; sleep 0.5; printf '$EXP\n'; sleep 0.5) | timeout 20 ../.pio/build/linux_x86_64/program - > out.txt 2>&1 || true
          kill $SIM || true
          cat out.txt
          set -x
          grep -q "\[EXP:CAPS=M66WAIT,UIO=" out.txt
          grep -q "PRINT,a=1.000000" out.txt   # L3: input went high during the wait
          grep -q "PRINT,b=0.000000" out.txt   # L2: falling edge
          grep -q "PRINT,d=-1.000000" out.txt  # timeout
          grep -q "PRINT,e=1.000000" out.txt   # L0 reads after the move (input changed during it)
          grep -q "\[EXP:CAPS=M66WAIT,UIO=16\]" out.txt
          grep -q "PRINT,f=1.000000" out.txt   # user input 15 = IN16
          grep -q "IN=8020,OUT=8000" out.txt   # user output 15 = OUT16

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fluidnc-linux_x86_64
          path: .pio/build/linux_x86_64/program
          if-no-files-found: error
