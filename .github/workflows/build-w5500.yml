name: Build FluidNC 4.1.1 W5500 (ESP32-S3 + ESP32 WROOM-32)

on:
  push:
    # bt-decode: a copy of a released commit plus .github/backtrace.txt, to
    # decode a crash backtrace against that build (see the Decode step)
    branches: [ fluidnc-4.1.1-w5500, bt-decode ]
  workflow_dispatch:
    inputs:
      backtrace:
        description: "Optional: paste a 'Backtrace: 0x...' line to decode against this build"
        required: false
        default: ""
        type: string

permissions:
  contents: write   # publish the "w5500-latest" release (plain file downloads)

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # git-version.py uses git history for the version string

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build firmware (wifi_s3)
        shell: bash
        run: |
          set -o pipefail
          # Compiler errors also go to the run's annotations (readable without the log)
          pio run -e wifi_s3 2>&1 | tee build.log || {
            grep -E "error|undefined|multiple definition|ld:|relocation|first defined" build.log | grep -v "^Compiling\|^Archiving\|^Indexing" | head -10 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }

      - name: Build merged flash image (bootloader + partitions + firmware + filesystem)
        run: pio run -e wifi_s3 -t build_merged

      - name: Collect binaries
        run: |
          # out/: only what is flashed. The .elf (backtrace decoding) goes to a
          # separate "debug" artifact. The filesystem image carries the stock
          # FluidNC WebUI; the dpCREATOR WebUI is a separate product, installed
          # on the board from dpcreator.eu.
          mkdir -p out debug
          B=.pio/build/wifi_s3
          cp $B/firmware.bin $B/bootloader.bin $B/partitions.bin out/
          cp $B/littlefs.bin out/ 2>/dev/null || true
          cp $B/merged-flash.bin out/ 2>/dev/null || true
          cp $B/firmware.elf debug/
          ls -l out debug

      # ESP32 (WROOM-32) install option: same dpCREATOR firmware for the many
      # FluidNC boards on the original ESP32 (4 MB flash, no PSRAM, no W5500,
      # Wi-Fi only). It never blocks the R3 (S3) release: if it fails, the
      # release goes out without the wroom32-* files.
      - name: Build firmware (wifi, ESP32 WROOM-32)
        id: wroom32
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pio run -e wifi 2>&1 | tee build-wroom32.log || {
            grep -E "error|undefined|multiple definition|ld:|relocation|first defined|overflow" build-wroom32.log | grep -v "^Compiling\|^Archiving\|^Indexing" | head -10 | while IFS= read -r l; do echo "::warning title=WROOM-32 build::$l"; done
            exit 1
          }
          grep -E "^(RAM|Flash):" build-wroom32.log | while IFS= read -r l; do echo "::notice title=WROOM-32 size::$l"; done

      - name: Build merged flash image (ESP32 WROOM-32)
        id: wroom32_merged
        if: steps.wroom32.outcome == 'success'
        continue-on-error: true
        env:
          # starter config.yaml without pins (the R3 config's pins do not exist on ESP32)
          PLATFORMIO_DATA_DIR: FluidNC/data_esp32
        run: pio run -e wifi -t build_merged

      - name: Collect ESP32 WROOM-32 binaries
        if: steps.wroom32.outcome == 'success'
        run: |
          B=.pio/build/wifi
          for f in firmware bootloader partitions littlefs merged-flash; do
            if [ -f $B/$f.bin ]; then cp $B/$f.bin out/wroom32-$f.bin; fi
          done
          cp $B/firmware.elf debug/wroom32-firmware.elf
          ls -l out debug

      - name: Decode backtrace
        if: ${{ inputs.backtrace != '' || hashFiles('.github/backtrace.txt') != '' }}
        env:
          BT: ${{ inputs.backtrace }}
        run: |
          [ -z "$BT" ] && BT=$(cat .github/backtrace.txt)
          A2L=$(find ~/.platformio/packages -name 'xtensa-esp32s3-elf-addr2line' -type f | head -1)
          [ -z "$A2L" ] && A2L=$(find ~/.platformio/packages -name '*addr2line' -type f | head -1)
          echo "Using $A2L"
          ADDRS=$(echo "$BT" | grep -oE '0x[0-9a-fA-F]{8}:0x[0-9a-fA-F]{8}' | cut -d: -f1 | tr '\n' ' ')
          echo "=== DECODED BACKTRACE ==="
          "$A2L" -pfiaC -e .pio/build/wifi_s3/firmware.elf $ADDRS | tee decoded.txt
          # also as annotations (readable without the job log)
          # (GitHub keeps 10 annotations per step: 12 lines per annotation)
          sed -e 's#/home/runner/[^ ]*/components/##' -e 's#/home/runner/work/[^ ]*/FluidNC/#FluidNC/#' decoded.txt | split -l 12 - part_
          for f in part_*; do echo "::notice title=backtrace::$(sed ':a;N;$!ba;s/\n/%0A/g' $f)"; done

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: fluidnc-4.1.1-w5500-s3-${{ github.sha }}
          path: out/
          retention-days: 30

      - name: Upload debug files
        uses: actions/upload-artifact@v4
        with:
          name: debug-elf-${{ github.sha }}
          path: debug/
          retention-days: 30

      # Plain downloads, no GitHub login and no zip: Actions artifacts need a
      # login (other browsers show "page missing") and zipped firmware is
      # often blocked by browsers. Replaced on every push.
      - name: Publish as release "w5500-latest"
        if: github.ref == 'refs/heads/fluidnc-4.1.1-w5500'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHORT=$(git rev-parse --short HEAD)
          echo "$SHORT $(git log -1 --format=%s)" > out/version.txt
          gh release delete w5500-latest -y --cleanup-tag || true
          gh release create w5500-latest out/* --prerelease --target "$GITHUB_SHA" \
            --title "dpCREATOR FluidNC 4.1.1 W5500 - latest build ($SHORT)" \
            --notes "Latest build of branch fluidnc-4.1.1-w5500 (commit $SHORT), replaced on every push. merged-flash.bin = fresh board at 0x0 (overwrites config.yaml); firmware.bin = update at 0x10000 over USB (network updates are off since 063dee80). Set the login password over USB with \$Auth/Set=<password> or on the first WebUI visit. The dpCREATOR WebUI is installed separately from dpcreator.eu. ESP32 (WROOM-32) boards: wroom32-merged-flash.bin = fresh board at 0x0 (starter config.yaml without pins, Wi-Fi only, no W5500); wroom32-firmware.bin = update at 0x10000 over USB. See W5500_ETHERNET.md."
